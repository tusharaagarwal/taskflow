services:
  - type: web
    name: taskflow-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        fromSecret: SECRET_KEY
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://taskflow-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: false

  - type: web
    name: taskflow-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_BASE
        value: "https://taskflow-backend.onrender.com/api/v1"
    dependsOn:
      - taskflow-backend

databases:
  - type: postgres
    name: taskflow-db
    plan: free