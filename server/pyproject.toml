[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "Tusshar Agarwaal"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "alembic (>=1.16.5,<2.0.0)",
    "fastapi (>=0.116.2,<0.117.0)",
    "click (>=8.3.0,<9.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "python-json-logger (>=4.0.0,<5.0.0)",
    "pygments (>=2.19.2,<3.0.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "psutil (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "langchain-openai (>=1.1.0,<2.0.0)",
    "langchain-core (>=1.1.1,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "langchain-anthropic (>=1.2.0,<2.0.0)",
    "boto3 (>=1.42.5,<2.0.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-cov (>=4.1.0,<6.0.0)",
    "ruff (>=0.8.0,<=1.4.0)",
    "aiosqlite (>=0.21.0,<0.22.0)"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/alembic_env/*",
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*",
    "app/monitoring/health.py",
    "app/constants/*"
]

[tool.coverage.report]
fail_under = 65
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
